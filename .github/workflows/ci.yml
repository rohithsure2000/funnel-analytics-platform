name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Unit tests use hand-crafted fixtures (see tests/), not the real
      # dataset, so they run without downloading anything -- the real
      # dataset is real, licensed Kaggle data (see data/README.md) that
      # isn't vendored into this repo or CI.
      - name: Run tests
        run: pytest -v
